# Serves the dashboard (static SPA) and proxies the API on the same origin.
# Plain-HTTP config for local/staging use. The production config (TLS, HSTS,
# upload size limits, unprivileged nginx) is in deploy/production/nginx/.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 2m;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Generated at image build time by `node web/scripts/csp.mjs`, which hashes
    # the inline script Nuxt adds to index.html (it changes every build).
    include /etc/nginx/snippets/csp.conf;
    try_files $uri /index.html;
  }
}
