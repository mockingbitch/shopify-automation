# Development stack. Not for production.
name: shopee-automation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopee_automation
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-owner_dev_pw}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-rw_dev_pw}
      APP_SYSTEM_PASSWORD: ${APP_SYSTEM_PASSWORD:-system_dev_pw}
    ports: ["127.0.0.1:${PG_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d shopee_automation"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_pw}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pw}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for development. MinIO no longer publishes
  # public images, so SeaweedFS provides the S3 API locally.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  jaeger:
    # Accepts OTLP directly; stands in for an OTel Collector in development.
    image: jaegertracing/jaeger:latest
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:16686:16686"]

volumes:
  pgdata:
  s3data:
