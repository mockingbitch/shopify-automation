# Single-host production reference. See docs/deployment.md.
#
# The managed platform (container service, managed Postgres/Redis/S3) is not
# chosen yet. This file shows the shape every target must keep: migrations
# run first as app_owner, the API is stateless behind Nginx, exactly one worker
# runs the scheduler, and secrets come from files, never from the environment.
#
# Postgres 17, Redis 7 and S3 are external (managed) services referenced by
# URL. They are deliberately not part of this file.
#
#   cp deploy/production/production.env.example deploy/production/production.env
#   # fill in production.env and deploy/production/secrets/*, then:
#   docker compose -f deploy/production/docker-compose.yml --env-file deploy/production/production.env up -d
#
# Optional ClamAV: add `--profile clamav` and set CLAMAV_ADDR=clamav:3310.
name: shopee-automation-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  user: "65532:65532" # distroless "nonroot"
  logging: *logging

# Settings shared by every Go process (api, worker). Secrets use *_FILE.
x-app-env: &app-env
  APP_ENV: production
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  COOKIE_SECURE: "true"
  SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-12h}
  SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-168h}
  DATABASE_URL_FILE: /run/secrets/database_url
  DATABASE_SYSTEM_URL_FILE: /run/secrets/database_system_url
  REDIS_URL_FILE: /run/secrets/redis_url
  ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
  ENCRYPTION_ACTIVE_KEY: ${ENCRYPTION_ACTIVE_KEY:?set ENCRYPTION_ACTIVE_KEY}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  S3_BUCKET: ${S3_BUCKET:-shopee-automation}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: "true"
  SMTP_ADDR: ${SMTP_ADDR:-}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
  # Optional relay authentication (PLAIN over STARTTLS); leave empty for an
  # unauthenticated internal relay.
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SHOPEE_HTTP_TIMEOUT: ${SHOPEE_HTTP_TIMEOUT:-15s}
  SHOPEE_RATE_PER_APP: ${SHOPEE_RATE_PER_APP:-50}
  SHOPEE_RATE_PER_SHOP: ${SHOPEE_RATE_PER_SHOP:-5}
  RECIPE_SIGNING_KEY_FILE: /run/secrets/recipe_signing_key
  RECIPE_SIGNING_KEY_ID: ${RECIPE_SIGNING_KEY_ID:-k1}
  EXTENSION_ORIGINS: ${EXTENSION_ORIGINS:-}
  # Optional malware scanning of uploads (clamd TCP address, e.g. clamav:3310).
  CLAMAV_ADDR: ${CLAMAV_ADDR:-}
  REQUIRE_ADMIN_MFA: "true"
  PWNED_PASSWORDS_URL: ${PWNED_PASSWORDS_URL:-}
  WORKFLOW_ORG_CONCURRENCY: ${WORKFLOW_ORG_CONCURRENCY:-10}
  ORG_RETENTION: ${ORG_RETENTION:-720h}

x-app-secrets: &app-secrets
  - database_url
  - database_system_url
  - redis_url
  - encryption_keys
  - s3_access_key
  - s3_secret_key
  - recipe_signing_key
  - smtp_password

services:
  # One-shot: applies pending migrations as the schema owner, then exits.
  # api and worker start only after it exits with status 0.
  migrate:
    <<: *hardening
    image: ${IMAGE:?set IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      APP_ENV: production
      DATABASE_MIGRATE_URL_FILE: /run/secrets/database_migrate_url
    secrets: [database_migrate_url]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  api:
    <<: *hardening
    image: ${IMAGE}:${IMAGE_TAG}
    entrypoint: ["/usr/local/bin/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      # Safe only because the API is reachable exclusively through nginx on
      # the internal network (no published ports). Nginx overwrites the header.
      TRUST_PROXY_HEADERS: "true"
    secrets: *app-secrets
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose: ["8080"]
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s # the server drains for up to 20s on SIGTERM
    # The distroless image has no curl: the binary probes its own /readyz.
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # Exactly one worker runs the scheduler (-scheduler). Scale extra workers
  # with a second service without -scheduler; never scale this one.
  worker:
    <<: *hardening
    image: ${IMAGE}:${IMAGE_TAG}
    entrypoint: ["/usr/local/bin/worker"]
    command: ["-scheduler", "-concurrency", "${WORKER_CONCURRENCY:-10}"]
    environment: *app-env
    secrets: *app-secrets
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s # asynq waits for running tasks before exiting
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 768M }

  nginx:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29-alpine}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "101:101" # nginx user of the unprivileged image
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Release artifact web-dist-<version>.tar.gz unpacked here. It contains
      # the SPA (public/) and csp.conf generated for that exact build.
      - ${WEB_DIST_DIR:?set WEB_DIST_DIR}/public:/usr/share/nginx/html:ro
      - ${WEB_DIST_DIR}/csp.conf:/etc/nginx/csp/csp.conf:ro
      - ${TLS_DIR:?set TLS_DIR}:/etc/nginx/tls:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=128m,uid=101,gid=101
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Nginx itself, then the API through nginx's own upstream.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/nginx-health && wget -q -O /dev/null http://127.0.0.1:8081/api-ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  # Optional. clamd needs ~3 GB RAM and a writable signature database.
  clamav:
    profiles: [clamav]
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    expose: ["3310"]
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [internal]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s # first signature download is slow
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 4G }

networks:
  # No published ports; api/worker/clamav reach the managed services through
  # the host's default route (internal: false is required for that egress).
  internal: {}
  edge: {}

volumes:
  clamav-db:

# Each file holds one value with no trailing newline needed (values are
# trimmed). Owner root, group 65532, mode 0640 so the nonroot user can read.
secrets:
  database_url:
    file: ./secrets/database_url
  database_system_url:
    file: ./secrets/database_system_url
  database_migrate_url:
    file: ./secrets/database_migrate_url
  redis_url:
    file: ./secrets/redis_url
  encryption_keys:
    file: ./secrets/encryption_keys
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  recipe_signing_key:
    file: ./secrets/recipe_signing_key
  smtp_password:
    file: ./secrets/smtp_password
