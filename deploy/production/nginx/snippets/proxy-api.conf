proxy_pass http://api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
# Overwrite (do not append): the API trusts the left-most entry
# (TRUST_PROXY_HEADERS=true). If a load balancer sits in front of nginx,
# configure real_ip (set_real_ip_from + real_ip_header) so $remote_addr is
# the client, never forward a client-supplied X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 65s; # API WriteTimeout is 60s
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
