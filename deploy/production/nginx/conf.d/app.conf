# Dashboard (static SPA) and API on one origin. Replace app.example.com with
# the PUBLIC_BASE_URL host. Certificates are mounted at /etc/nginx/tls.

upstream api_upstream {
  zone api_upstream 64k;
  server api:8080 resolve;
  keepalive 32;
}

# Per-client request rate for the API (the API has its own finer limits on
# login, registration and pairing; this is a coarse flood guard).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_status 429;

# HTTP: ACME challenges and a redirect, nothing else.
server {
  listen 8080 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }
  location / {
    return 308 https://$host$request_uri;
  }
}

# Unknown Host headers on 443 get no content.
server {
  listen 8443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  return 444;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name app.example.com;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;

  root /usr/share/nginx/html;

  # JSON bodies are capped at 1 MiB by the API; multipart routes below.
  client_max_body_size 2m;

  include /etc/nginx/snippets/security-headers.conf;

  # Product import upload: POST /api/v1/orgs/{orgID}/imports (20 MB file
  # plus multipart overhead).
  location ~ ^/api/v1/orgs/[^/]+/imports$ {
    client_max_body_size 21m;
    limit_req zone=api_per_ip burst=60 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
  }

  # Product image upload: POST /api/v1/orgs/{orgID}/products/{id}/images (10 MB).
  location ~ ^/api/v1/orgs/[^/]+/products/[^/]+/images$ {
    client_max_body_size 11m;
    limit_req zone=api_per_ip burst=60 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
  }

  # Everything else under /api/ (incl. /api/v1/ext, /api/v1/webhooks/shopee,
  # /api/v1/oauth/shopee/callback). The API sets its own CSP for responses.
  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
  }

  # /healthz and /readyz are for the internal network only.
  location = /healthz { return 404; }
  location = /readyz  { return 404; }

  # Hashed build assets: cache forever.
  location /_nuxt/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA routes fall back to index.html. csp.conf is generated per build by
  # `node web/scripts/csp.mjs` (it hashes Nuxt's inline script) and shipped
  # in the web release artifact.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/csp/csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

# Local-only status server for the container healthcheck.
server {
  listen 127.0.0.1:8081;
  access_log off;
  location = /nginx-health { return 204; }
  location = /api-ready {
    proxy_pass http://api_upstream/readyz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
}
