# Main config for nginxinc/nginx-unprivileged (runs as uid 101, root fs
# read-only; every writable path is under the /tmp tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  # $uri (not $request_uri) keeps OAuth codes and other query strings out of logs.
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off;

  # Slow-client protection.
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv application/javascript application/json
             application/problem+json application/xml image/svg+xml;

  # Docker's embedded DNS; lets the upstream follow api replicas as they
  # are replaced (nginx >= 1.27.3 "resolve").
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
