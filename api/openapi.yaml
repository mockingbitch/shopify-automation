      responses:
        '202': {$ref: '#/components/responses/RunView202'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}/steps/{stepID}/complete:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
      - {name: stepID, in: path, required: true, schema: {type: string}}
    post:
      tags: [workflows]
      summary: Mark a step's manual tasks as done
      x-permission: workflows.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 1000, nullable: true}
      responses:
        '202': {$ref: '#/components/responses/RunView202'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflow-events:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [workflows]
      summary: Execution log across all runs, newest first
      x-permission: workflows.read
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [info, warn, error]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {$ref: '#/components/responses/Events'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/approvals:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [workflows]
      summary: List approvals, newest first
