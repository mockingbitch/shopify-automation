openapi: 3.0.3
info:
  title: Shopee Shop Automation API
  version: 0.1.0
  description: |
    REST API for the Shopee Shop Automation platform: authentication,
    organizations, membership, invitations, audit logs (Phase 1), and Shopee
    shop connections, capabilities, webhooks and partner-app administration
    (Phase 2), and shop templates with versions, overrides and previews
    (Phase 3), workflows with approvals and manual tasks (Phase 4), and products with
    imports and publishing (Phase 5).

    Conventions (see docs/api-design.md):
    - Session cookie `sid` (`__Host-sid` over HTTPS). Unsafe methods need the
      `X-CSRF-Token` header returned by `GET /auth/session` or `POST /auth/login`.
    - Organization-scoped routes live under `/orgs/{orgID}`. Non-members get
      `404`, never `403`, so organization IDs cannot be probed.
    - Errors use RFC 9457 problem details (`application/problem+json`).
servers:
  - url: /api/v1

security:
  - session: []
    csrf: []

tags:
  - name: auth
  - name: organizations
  - name: members
  - name: invitations
  - name: audit
  - name: shops
  - name: templates
  - name: workflows
  - name: products
  - name: imports
  - name: webhooks
  - name: admin

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: Always returns 202 and sends an email, so the response never reveals whether the email is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '202': {$ref: '#/components/responses/CheckEmail'}
        '400': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed in. Sets the session cookie.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Confirm an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '204': {description: Verified}
        '400': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {$ref: '#/components/responses/CheckEmail'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: Signs out every session of the user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '204': {description: Password changed}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Send a new verification email to the signed-in user
      description: Same response whether or not the address is already verified. Limited to 3 per hour.
      responses:
        '202': {$ref: '#/components/responses/CheckEmail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out the current session
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /auth/session:
    get:
      tags: [auth]
      summary: Current user, CSRF token and memberships (dashboard bootstrap)
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}

  /me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200': {$ref: '#/components/responses/User'}
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200': {$ref: '#/components/responses/User'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs:
    post:
      tags: [organizations]
      summary: Create an organization (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrgRequest'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {schema: {type: string}}
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [organizations]
      summary: Organizations the caller belongs to
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Membership'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Problem'}

  /invitations/accept:
    post:
      tags: [invitations]
      summary: Accept an invitation (signed-in email must match the invitation)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [organizations]
      summary: Get the organization
      x-permission: org.read
      responses:
        '200':
          description: Organization
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [organizations]
      summary: Update name or settings
      x-permission: org.update
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: ETag from GET}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                settings: {$ref: '#/components/schemas/OrgSettings'}
      responses:
        '200':
          description: Updated
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [organizations]
      summary: Delete the organization (soft delete)
      x-permission: org.delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_slug]
              properties:
                confirm_slug: {type: string}
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/transfer-ownership:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    post:
      tags: [organizations]
      summary: Make another member the owner; the current owner becomes admin
      x-permission: org.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_owner_user_id]
              properties:
                new_owner_user_id: {type: string, format: uuid}
      responses:
        '204': {description: Transferred}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/members:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [members]
      summary: List members
      x-permission: members.read
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/members/{memberID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: memberID, in: path, required: true, schema: {type: string}}
    patch:
      tags: [members]
      summary: Change a member's role
      description: You cannot change your own role, give a role above your own, or change the owner (use transfer).
      x-permission: members.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/AssignableRole'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Member'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [members]
      summary: Remove a member, or leave the organization when memberID is your own
      x-permission: members.manage (not required to remove yourself)
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/invitations:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    post:
      tags: [invitations]
      summary: Invite someone by email (valid 7 days)
      x-permission: members.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/AssignableRole'}
      responses:
        '201':
          description: Invitation created and emailed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Invitation'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [invitations]
      summary: List open invitations
      x-permission: members.manage
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Invitation'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/invitations/{invitationID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: invitationID, in: path, required: true, schema: {type: string}}
    delete:
      tags: [invitations]
      summary: Revoke an open invitation
      x-permission: members.manage
      responses:
        '204': {description: Revoked}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/audit-logs:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [audit]
      summary: List audit log entries, newest first
      x-permission: audit.read
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}}
        - {name: target_type, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AuditLog'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [shops]
      summary: List connected shops
      x-permission: shops.read
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ConnectionStatus'}}
        - {name: region, in: query, schema: {type: string}}
        - {name: q, in: query, description: 'Shop name contains, or exact Shopee shop ID', schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Shops
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Shop'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/connect:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    post:
      tags: [shops]
      summary: Start connecting a Shopee shop
      description: |
        Returns the Shopee authorization URL. The browser opens it; after the
        seller authorizes, Shopee redirects to `GET /oauth/shopee/callback`.
        The `state` in the URL is single-use, bound to this user and
        organization, and expires after 10 minutes.
      x-permission: shops.connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shopee_app_id: {type: string, format: uuid, nullable: true, description: Needed only when several Shopee apps are enabled}
      responses:
        '200': {$ref: '#/components/responses/ConnectResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/connect/{stateID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: stateID, in: path, required: true, schema: {type: string}}
    get:
      tags: [shops]
      summary: Shops offered by a main-account authorization
      description: Available for 30 minutes to the user who authorized, until shops are selected.
      x-permission: shops.connect
      responses:
        '200':
          description: Pending selection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Selection'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/connect/{stateID}/select:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: stateID, in: path, required: true, schema: {type: string}}
    post:
      tags: [shops]
      summary: Attach shops from a main-account authorization
      x-permission: shops.connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shopee_shop_ids]
              properties:
                shopee_shop_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {type: string, pattern: '^[0-9]+$'}
      responses:
        '201':
          description: Attached shops
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Shop'}
                  next_cursor: {type: string, nullable: true}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/{shopID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/ShopID'}
    get:
      tags: [shops]
      summary: Shop with profile, capabilities and authorization history
      x-permission: shops.read
      responses:
        '200':
          description: Shop detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ShopDetail'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [shops]
      summary: Disconnect a shop
      description: Deletes the stored tokens and synced Shopee data. History and audit entries are kept. Idempotent.
      x-permission: shops.disconnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: {type: boolean, enum: [true]}
      responses:
        '204': {description: Disconnected}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/{shopID}/capabilities:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/ShopID'}
    get:
      tags: [shops]
      summary: Resolved capabilities of a shop
      x-permission: shops.read
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Capability'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/{shopID}/sync:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/ShopID'}
    post:
      tags: [shops]
      summary: Queue a sync of shop information from Shopee
      description: Requests within the same minute share one job.
      x-permission: shops.sync
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [job_id]
                    properties:
                      job_id: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/shops/{shopID}/reconnect:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/ShopID'}
    post:
      tags: [shops]
      summary: Start re-authorizing an existing shop
      description: The seller must authorize the same Shopee shop; another shop is rejected.
      x-permission: shops.connect
      responses:
        '200': {$ref: '#/components/responses/ConnectResult'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}

  /oauth/shopee/callback:
    get:
      tags: [shops]
      summary: Shopee authorization redirect target
      description: |
        Shopee redirects the seller here. Always answers `302`: to the shop
        page on success, to the shop list with `connect_error=<code>` on
        failure, to the shop selection page for main-account logins, or to
        `/login?next=...` when the browser has no session.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: shop_id, in: query, schema: {type: string}}
        - {name: main_account_id, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        '302':
          description: Redirect to the dashboard
          headers:
            Location: {schema: {type: string}}

  /webhooks/shopee/{appID}:
    parameters:
      - {name: appID, in: path, required: true, schema: {type: string}}
    post:
      tags: [webhooks]
      summary: Shopee push notifications
      description: |
        Verified with the `Authorization` header:
        `hex(HMAC-SHA256(partner_key, push_callback_url + "|" + raw_body))`.
        Stored, acknowledged with an empty `204`, processed asynchronously.
      security: []
      parameters:
        - {name: Authorization, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '204': {description: Accepted}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}

  /template-sections:
    get:
      tags: [templates]
      summary: JSON Schemas (draft 2020-12) of the template sections
      description: Source of truth for section content. Fields carry `x-capability` and `x-sensitive` annotations.
      responses:
        '200':
          description: Section schemas in display order
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, applies_to, schema]
                      properties:
                        key: {$ref: '#/components/schemas/SectionKey'}
                        applies_to: {type: string, enum: [shop, products, defaults]}
                        schema: {type: object, additionalProperties: true}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [templates]
      summary: List templates
      x-permission: templates.read
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Template'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [templates]
      summary: Create a template with its first draft
      x-permission: templates.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                description: {type: string, maxLength: 1000}
                sections:
                  type: object
                  description: Initial content per section key; other sections start empty.
                  additionalProperties: {type: object, additionalProperties: true}
      responses:
        '201': {$ref: '#/components/responses/TemplateCreated'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
    get:
      tags: [templates]
      summary: Template with its versions, newest first
      x-permission: templates.read
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [template, versions]
                    properties:
                      template: {$ref: '#/components/schemas/Template'}
                      versions:
                        type: array
                        items: {$ref: '#/components/schemas/TemplateVersion'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [templates]
      summary: Rename or describe a template
      x-permission: templates.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                description: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Template'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [templates]
      summary: Delete a template (soft delete)
      description: Refused with `409 template_in_use` while workflow runs that use the template are active.
      x-permission: templates.publish
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/clone:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
    post:
      tags: [templates]
      summary: Copy a version into a new template
      description: Defaults to the published version, else the latest one.
      x-permission: templates.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                from_version_id: {type: string, format: uuid, nullable: true}
      responses:
        '201': {$ref: '#/components/responses/TemplateCreated'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
    post:
      tags: [templates]
      summary: Start a new draft from an existing version
      x-permission: templates.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from_version_id]
              properties:
                from_version_id: {type: string, format: uuid}
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TemplateVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
    get:
      tags: [templates]
      summary: Version with its sections
      x-permission: templates.read
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version, sections]
                    properties:
                      version: {$ref: '#/components/schemas/TemplateVersion'}
                      sections:
                        type: array
                        items: {$ref: '#/components/schemas/TemplateSection'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}/sections/{sectionKey}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
      - {name: sectionKey, in: path, required: true, schema: {type: string}}
    put:
      tags: [templates]
      summary: Replace one section of a draft
      description: Body is the section object, validated against its JSON Schema. Requires `If-Match` with the section's `etag`.
      x-permission: templates.write
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Section
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TemplateSection'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}/validate:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
    post:
      tags: [templates]
      summary: Validate a version
      x-permission: templates.read
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ValidationReport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}/publish:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
    post:
      tags: [templates]
      summary: Publish a draft
      description: The version becomes immutable and current; the previous published version is archived. `422` lists validation errors.
      x-permission: templates.publish
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TemplateVersion'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}/preview:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
    post:
      tags: [templates]
      summary: Preview the changes a version would make on shops
      description: |
        Per shop: the version merged with the shop's overrides, compared with
        the last synced profile. Values Shopee was not read for are
        `current_known: false`; they are read before applying (Phase 4).
      x-permission: templates.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_ids]
              properties:
                shop_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Previews
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ShopPreview'}
                  next_cursor: {type: string, nullable: true}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/shops/{shopID}/overrides:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/ShopID'}
    get:
      tags: [templates]
      summary: Shop-specific overrides of a template
      x-permission: templates.read
      responses:
        '200': {$ref: '#/components/responses/Overrides'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [templates]
      summary: Replace shop-specific overrides
      description: Partial sections, deep-merged on top of the template (objects merge, arrays replace). `{}` clears them.
      x-permission: templates.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [overrides]
              properties:
                overrides:
                  type: object
                  additionalProperties: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/Overrides'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/templates/{templateID}/versions/{versionID}/apply:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/TemplateID'}
      - {$ref: '#/components/parameters/VersionID'}
    post:
      tags: [workflows]
      summary: Apply a published version to shops
      description: |
        Starts one SHOP_SETUP run per shop, sharing a batch ID. With an
        `Idempotency-Key` (UUID), repeating the same request returns the same
        runs (`replayed: true`); the same key with a different request is `409`.
      x-permission: workflows.run
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_ids]
              properties:
                shop_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {type: string, format: uuid}
      responses:
        '202':
          description: Runs started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [batch_id, workflow_run_ids, replayed]
                    properties:
                      batch_id: {type: string, format: uuid}
                      workflow_run_ids:
                        type: array
                        items: {type: string, format: uuid}
                      replayed: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [workflows]
      summary: List workflow runs, newest first
      x-permission: workflows.read
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/RunStatus'}}
        - {name: shop_id, in: query, schema: {type: string, format: uuid}}
        - {name: batch_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RunSummary'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
    get:
      tags: [workflows]
      summary: Run with steps, progress and pending approval
      x-permission: workflows.read
      responses:
        '200': {$ref: '#/components/responses/RunView200'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}/events:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
    get:
      tags: [workflows]
      summary: Run events in order (poll with `after`)
      x-permission: workflows.read
      parameters:
        - {name: after, in: query, description: Cursor from the previous response, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        '200': {$ref: '#/components/responses/Events'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}/cancel:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
    post:
      tags: [workflows]
      summary: Cancel a run
      description: Changes already applied on Shopee are not rolled back.
      x-permission: workflows.cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 500, nullable: true}
      responses:
        '202': {$ref: '#/components/responses/RunView202'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}/retry:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
    post:
      tags: [workflows]
      summary: Retry the failed steps of a run
      description: Succeeded steps are never run again.
      x-permission: workflows.retry
      responses:
        '202': {$ref: '#/components/responses/RunView202'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/workflows/{runID}/resume:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/RunID'}
    post:
      tags: [workflows]
      summary: Resume steps waiting for a user (e.g. after reconnecting)
