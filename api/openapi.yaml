    post:
      tags: [products]
      summary: Create a product
      x-permission: products.write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201': {$ref: '#/components/responses/Product'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/products/publish:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    post:
      tags: [products]
      summary: Publish products to shops
      description: |
        Starts one PRODUCT_PUBLISH run per shop, sharing a batch ID. Choose
        products by `product_ids` or by `import_batch_id` (exactly one). Each
        run checks products against the shop's categories, attributes, brands
        and logistics, asks for approval, then creates items with `add_item`.
        Items are created as `UNLIST` unless `item_status` is `NORMAL`. With an
        `Idempotency-Key` (UUID), repeating the same request returns the same
        runs (`replayed: true`); the same key with a different request is `409`.
      x-permission: workflows.run
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_ids]
              properties:
                product_ids:
                  type: array
                  maxItems: 200
                  items: {type: string, format: uuid}
                import_batch_id: {type: string, format: uuid}
                shop_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {type: string, format: uuid}
                item_status: {type: string, enum: [UNLIST, NORMAL]}
      responses:
        '202':
          description: Runs started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [batch_id, workflow_run_ids, replayed]
                    properties:
                      batch_id: {type: string, format: uuid}
                      workflow_run_ids:
                        type: array
                        items: {type: string, format: uuid}
                      replayed: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/products/{productID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: productID, in: path, required: true, schema: {type: string}}
    get:
      tags: [products]
      summary: Product with variations, images and per-shop mappings
      x-permission: products.read
      responses:
        '200': {$ref: '#/components/responses/Product'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [products]
      summary: Replace a product (images are kept)
      description: Requires `If-Match` with the product's ETag.
      x-permission: products.write
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200': {$ref: '#/components/responses/Product'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [products]
      summary: Delete a product (soft; items on Shopee are not deleted)
      x-permission: products.write
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/products/{productID}/images:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: productID, in: path, required: true, schema: {type: string}}
    post:
      tags: [products]
      summary: Upload a product image
      description: JPEG, PNG or WebP, at most 10 MB and 40 megapixels. Stored re-encoded as JPEG or PNG.
      x-permission: products.write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Image
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProductImage'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/products/{productID}/images/{imageID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {name: productID, in: path, required: true, schema: {type: string}}
      - {name: imageID, in: path, required: true, schema: {type: string}}
    delete:
      tags: [products]
      summary: Remove an image
      x-permission: products.write
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [imports]
      summary: Recent imports
      x-permission: products.read
      responses:
        '200':
          description: Imports
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ImportBatch'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [imports]
      summary: Upload a CSV or XLSX file
      description: |
        At most 50 MB and 100,000 rows. Parsing, validation and product
        creation run in the background; valid rows become products, invalid
        rows can be fixed and retried. Optional template defaults (category
        mappings, SKU rules, product defaults, descriptions, attributes).
      x-permission: imports.write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                template_id: {type: string, format: uuid}
                template_version_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/ImportBatch'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/sample.csv:
    parameters: [{$ref: '#/components/parameters/OrgID'}]
    get:
      tags: [imports]
      summary: Sample import file
      x-permission: products.read
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/{batchID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/BatchID'}
    get:
      tags: [imports]
      summary: Import status and counts
      x-permission: products.read
      responses:
        '200': {$ref: '#/components/responses/ImportBatch200'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/{batchID}/rows:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/BatchID'}
    get:
      tags: [imports]
      summary: Rows with their errors
      x-permission: products.read
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, VALID, INVALID, IMPORTED, FAILED]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ImportRow'}
                  next_cursor: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/{batchID}/rows/{rowID}:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/BatchID'}
      - {name: rowID, in: path, required: true, schema: {type: string}}
    patch:
      tags: [imports]
      summary: Correct cells of a row and re-validate
      description: An empty value removes the cell. Imported rows cannot be changed.
      x-permission: imports.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: {type: string}
      responses:
        '200':
          description: Row
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ImportRow'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/{batchID}/retry:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/BatchID'}
    post:
      tags: [imports]
      summary: Import rows that became valid and retry failed ones
      x-permission: imports.write
      responses:
        '202': {$ref: '#/components/responses/ImportBatch'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /orgs/{orgID}/imports/{batchID}/report:
    parameters:
      - {$ref: '#/components/parameters/OrgID'}
      - {$ref: '#/components/parameters/BatchID'}
    get:
      tags: [imports]
      summary: Short-lived download link for the CSV report
      x-permission: products.read
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expires_at]
                    properties:
                      url: {type: string}
                      expires_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /admin/shopee-apps:
    get:
      tags: [admin]
      summary: List Shopee partner apps
      description: Platform admins only; everyone else gets 404.
      responses:
        '200':
          description: Apps
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ShopeeApp'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [admin]
      summary: Register a Shopee partner app
      description: Hosts default to the documented hosts of the environment. The partner key is stored encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShopeeAppRequest'}
      responses:
        '201': {$ref: '#/components/responses/ShopeeApp'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /admin/shopee-apps/{appID}:
    parameters:
      - {name: appID, in: path, required: true, schema: {type: string}}
    patch:
      tags: [admin]
      summary: Update a Shopee partner app
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateShopeeAppRequest'}
      responses:
        '200': {$ref: '#/components/responses/ShopeeApp'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sid
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token

  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      schema: {type: string}
    BatchID:
      name: batchID
      in: path
      required: true
      schema: {type: string}
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string}
    TemplateID:
      name: templateID
      in: path
      required: true
      schema: {type: string}
    VersionID:
      name: versionID
      in: path
      required: true
      schema: {type: string}
    ShopID:
      name: shopID
      in: path
      required: true
      schema: {type: string}

  responses:
    Product:
      description: Product
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Product'}
    ImportBatch:
      description: Import accepted
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ImportBatch'}
    ImportBatch200:
      description: Import
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ImportBatch'}
    RunView200:
      description: Run
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/RunView'}
    RunView202:
      description: Accepted; current state of the run
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/RunView'}
    Approval200:
      description: Approval
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Approval'}
    Events:
      description: Events
      content:
        application/json:
          schema:
            type: object
            required: [data, next_cursor]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/WorkflowEvent'}
              next_cursor: {type: string, nullable: true}
    TemplateCreated:
      description: Template and its draft
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [template, draft_version]
                properties:
                  template: {$ref: '#/components/schemas/Template'}
                  draft_version: {$ref: '#/components/schemas/TemplateVersion'}
    Overrides:
      description: Shop overrides
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [shop_id, overrides, updated_at]
                properties:
                  shop_id: {type: string, format: uuid}
                  overrides:
                    type: object
                    additionalProperties: {type: object, additionalProperties: true}
                  updated_at: {type: string, format: date-time, nullable: true}
    ConnectResult:
      description: Authorization URL to open in the browser
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: {type: string}
                  expires_at: {type: string, format: date-time}
    ShopeeApp:
      description: Shopee partner app
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ShopeeApp'}
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CheckEmail:
      description: Accepted; instructions were emailed if applicable
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [check_email]}
    User:
      description: User
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/User'}

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: Stable machine-readable error code}
        detail: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
        upstream:
          type: object
          description: Normalized Shopee error, only for members who manage shops.
          required: [code]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 100}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string}

    User:
      type: object
      required: [id, email, display_name, email_verified, is_platform_admin, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        email_verified: {type: boolean}
        is_platform_admin: {type: boolean}
        created_at: {type: string, format: date-time}

    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, csrf_token]
          properties:
            user: {$ref: '#/components/schemas/User'}
            csrf_token: {type: string}
            memberships:
              type: array
              items: {$ref: '#/components/schemas/Membership'}

    Role:
      type: string
      enum: [owner, admin, operator, viewer]

    AssignableRole:
      type: string
      enum: [admin, operator, viewer]

    OrgSettings:
      type: object
      additionalProperties: false
      required: [allow_self_approval]
      properties:
        allow_self_approval: {type: boolean}

    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$'}

    Org:
      type: object
      required: [id, name, slug, plan, settings, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        plan: {type: string}
        settings: {$ref: '#/components/schemas/OrgSettings'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    OrgEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Org'}

    Membership:
      type: object
      required: [organization, role, permissions]
      properties:
        organization: {$ref: '#/components/schemas/Org'}
        role: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {type: string}

    Member:
      type: object
      required: [id, user_id, email, display_name, role, joined_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        joined_at: {type: string, format: date-time}

    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role: {$ref: '#/components/schemas/AssignableRole'}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    AuditLog:
      type: object
      required: [id, actor_user_id, actor_type, action, target_type, target_id, outcome, metadata, ip, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid, nullable: true}
        actor_type: {type: string, enum: [user, system, shopee]}
        action: {type: string}
        target_type: {type: string, nullable: true}
        target_id: {type: string, format: uuid, nullable: true}
        outcome: {type: string, enum: [success, failure, denied]}
        metadata: {type: object}
        ip: {type: string, nullable: true}
        request_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    ConnectionStatus:
      type: string
      enum: [PENDING, ACTIVE, RECONNECT_REQUIRED, REVOKED, EXPIRED, DISCONNECTED]

    Shop:
      type: object
      description: A Shopee shop connection. Never contains tokens. Shopee IDs are strings.
      required: [id, shopee_shop_id, shopee_app_id, environment, region, shop_name, connection_status,
        authorization_expires_at, last_synced_at, last_sync_error, connected_at, created_at]
      properties:
        id: {type: string, format: uuid}
        shopee_shop_id: {type: string, pattern: '^[0-9]+$'}
        shopee_app_id: {type: string, format: uuid}
        environment: {type: string, enum: [sandbox, production]}
        region: {type: string, nullable: true}
        shop_name: {type: string, nullable: true}
        connection_status: {$ref: '#/components/schemas/ConnectionStatus'}
        authorization_expires_at: {type: string, format: date-time, nullable: true}
        last_synced_at: {type: string, format: date-time, nullable: true}
        last_sync_error: {type: string, nullable: true}
        connected_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    ShopProfile:
      type: object
      required: [shop_name, region, status, shop_logo_url, description, is_cb, is_sip, merchant_id, fetched_at]
      properties:
        shop_name: {type: string, nullable: true}
        region: {type: string, nullable: true}
        status: {type: string, nullable: true, description: 'Shopee shop status: NORMAL, BANNED or FROZEN'}
        shop_logo_url: {type: string, nullable: true}
        description: {type: string, nullable: true}
        is_cb: {type: boolean, nullable: true}
        is_sip: {type: boolean, nullable: true}
        merchant_id: {type: string, nullable: true}
        fetched_at: {type: string, format: date-time}

    Capability:
      type: object
      required: [key, title, mode, enabled, reason, requires_approval, sensitive, verification]
      properties:
        key: {type: string}
        title: {type: string}
        mode: {type: string, enum: [API, BROWSER, MANUAL, UNSUPPORTED]}
        enabled: {type: boolean}
        reason:
          type: string
          description: Empty when enabled without caveats.
          enum: ['', not_supported, disabled_by_platform, region_not_supported, app_type_not_allowed,
            shop_not_active, not_sandbox_verified, browser_extension_unavailable]
        requires_approval: {type: boolean}
        sensitive: {type: boolean}
        verification: {type: string, enum: [DOC_VERIFIED, SANDBOX_VERIFIED]}

    AuthorizationEvent:
      type: object
      required: [event, source, expire_time, created_at]
      properties:
        event: {type: string, enum: [GRANTED, REAUTHORIZED, REFRESHED, REFRESH_FAILED, EXPIRING, EXPIRED, REVOKED, DISCONNECTED]}
        source: {type: string, enum: [callback, push, sync, refresh, user]}
        expire_time: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    ShopDetail:
      type: object
      required: [shop, profile, capabilities, history]
      properties:
        shop: {$ref: '#/components/schemas/Shop'}
        profile:
          allOf: [{$ref: '#/components/schemas/ShopProfile'}]
          nullable: true
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/Capability'}
        history:
          type: array
          items: {$ref: '#/components/schemas/AuthorizationEvent'}

    Selection:
      type: object
      required: [id, shops, expires_at]
      properties:
        id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        shops:
          type: array
          items:
            type: object
            required: [shopee_shop_id, shop_name, region]
            properties:
              shopee_shop_id: {type: string}
              shop_name: {type: string, nullable: true}
              region: {type: string, nullable: true}

    ShopeeApp:
      type: object
      description: A Shopee partner app. The partner key is write-only.
      required: [id, name, environment, api_host, auth_host, partner_id, app_type, redirect_uri,
        push_callback_url, enabled, partner_key_set, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        environment: {type: string, enum: [sandbox, production]}
        api_host: {type: string}
        auth_host: {type: string}
        partner_id: {type: string}
        app_type: {type: string}
        redirect_uri: {type: string}
        push_callback_url: {type: string, nullable: true}
        enabled: {type: boolean}
        partner_key_set: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    CreateShopeeAppRequest:
      type: object
      additionalProperties: false
      required: [name, environment, partner_id, partner_key, app_type]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        environment: {type: string, enum: [sandbox, production]}
        partner_id: {type: string, pattern: '^[0-9]+$'}
        partner_key: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
        app_type: {type: string, minLength: 1, maxLength: 64, example: ERP System}
        api_host: {type: string, nullable: true}
        auth_host: {type: string, nullable: true}
        redirect_uri: {type: string, nullable: true}
        push_callback_url: {type: string, nullable: true}
        enabled: {type: boolean, nullable: true}

    UpdateShopeeAppRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        partner_key: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
        app_type: {type: string, minLength: 1, maxLength: 64}
        api_host: {type: string}
        auth_host: {type: string}
        redirect_uri: {type: string}
        push_callback_url: {type: string, description: Empty string clears it}
        enabled: {type: boolean}

    SectionKey:
      type: string
      enum: [general, branding, description, contact, warehouse, return_address, logistics, product_defaults,
        category_mappings, sku_rules, default_descriptions, default_attributes]

    Template:
      type: object
      required: [id, name, description, current_published_version_id, draft_version_id, latest_version_no,
        cloned_from_version_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        current_published_version_id: {type: string, format: uuid, nullable: true}
        draft_version_id: {type: string, format: uuid, nullable: true}
        latest_version_no: {type: integer}
        cloned_from_version_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TemplateVersion:
      type: object
      required: [id, template_id, version_no, status, based_on_id, content_sha256, published_at, published_by, created_at]
      properties:
        id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
        based_on_id: {type: string, format: uuid, nullable: true}
        content_sha256: {type: string, nullable: true}
        published_at: {type: string, format: date-time, nullable: true}
        published_by: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}

    TemplateSection:
      type: object
      required: [key, content, etag, updated_at]
      properties:
        key: {$ref: '#/components/schemas/SectionKey'}
        content: {type: object, additionalProperties: true}
        etag: {type: string, description: Send as If-Match when replacing the section}
        updated_at: {type: string, format: date-time}

    Issue:
      type: object
      required: [field, code, message]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}

    ValidationReport:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Issue'}

    Change:
      type: object
      required: [path, section, current, current_known, target, capability, mode, enabled, reason, sensitive, default_selected]
      properties:
        path: {type: string, example: general.shop_name}
        section:
          description: A template section, or `products` for PRODUCT_PUBLISH approvals.
          oneOf:
            - {$ref: '#/components/schemas/SectionKey'}
            - {type: string, enum: [products]}
        current: {nullable: true, description: Last known value; null when unknown}
        current_known: {type: boolean}
        target: {nullable: true}
        capability: {type: string}
        mode: {type: string, enum: [API, BROWSER, MANUAL, UNSUPPORTED]}
        enabled: {type: boolean}
        reason: {type: string}
        sensitive: {type: boolean, description: Never selected by default (FR-TPL-7)}
        default_selected: {type: boolean}
        note: {type: string}

    ShopPreview:
      type: object
      required: [shop_id, shop_name, connection_status, has_overrides, errors, warnings, changes, blocked]
      properties:
        shop_id: {type: string, format: uuid}
        shop_name: {type: string, nullable: true}
        connection_status: {$ref: '#/components/schemas/ConnectionStatus'}
        has_overrides: {type: boolean}
        errors:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        changes:
          type: array
          items: {$ref: '#/components/schemas/Change'}
        blocked:
          type: array
          description: Changes whose capability is not available for this shop
          items: {$ref: '#/components/schemas/Change'}

    RunStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_APPROVAL, WAITING_USER, COMPLETED, PARTIALLY_COMPLETED, FAILED, CANCELLED]

    RunSummary:
      type: object
      required: [id, definition, definition_version, shop_id, batch_id, status, input, output, created_by,
        cancel_requested, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        definition: {type: string, example: SHOP_SETUP}
        definition_version: {type: integer}
        shop_id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid, nullable: true}
        status: {$ref: '#/components/schemas/RunStatus'}
        input: {type: object, additionalProperties: true}
        output: {type: object, additionalProperties: true, description: Report of the run when finished}
        created_by: {type: string, format: uuid, nullable: true}
        cancel_requested: {type: boolean}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}

    WorkflowStep:
      type: object
      required: [id, key, item_key, position, status, blocking, capability, attempt_count, max_attempts, next_attempt_at,
        output, error, skip_reason, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        item_key: {type: string, nullable: true, description: 'Set on fan-out item steps (for PRODUCT_PUBLISH: the product ID)'}
        position: {type: integer}
        status: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SKIPPED, CANCELLED, WAITING_APPROVAL, WAITING_USER]}
        blocking: {type: boolean, description: false when the run continues after this step fails}
        capability: {type: string, nullable: true}
        attempt_count: {type: integer}
        max_attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time, nullable: true, description: Set while waiting to retry}
        output: {nullable: true, description: 'Step output; for WAITING_USER: {reason, message, tasks[], result}'}
        error: {nullable: true}
        skip_reason: {type: string, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}

    RunView:
      type: object
      required: [run, steps, progress, pending_approval]
      properties:
        run: {$ref: '#/components/schemas/RunSummary'}
        steps:
          type: array
          items: {$ref: '#/components/schemas/WorkflowStep'}
        progress:
          type: object
          required: [total, done]
          properties:
            total: {type: integer}
            done: {type: integer}
        pending_approval:
          allOf: [{$ref: '#/components/schemas/Approval'}]
          nullable: true

    Approval:
      type: object
      required: [id, run_id, step_id, shop_id, run_created_by, status, diff, selected_changes, decided_by, comment, decided_at, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid}
        shop_id: {type: string, format: uuid}
        run_created_by: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED]}
        diff:
          type: object
          required: [changes, blocked]
          properties:
            changes:
              type: array
              items: {$ref: '#/components/schemas/Change'}
            blocked:
              type: array
              items: {$ref: '#/components/schemas/Change'}
        selected_changes:
          type: array
          items: {type: string}
        decided_by: {type: string, format: uuid, nullable: true}
        comment: {type: string, nullable: true}
        decided_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    WorkflowEvent:
      type: object
      required: [id, run_id, step_id, type, level, message, data, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid, nullable: true}
        type: {type: string, enum: [RUN_CREATED, RUN_STATUS_CHANGED, STEP_STATUS_CHANGED, STEP_ATTEMPT_STARTED,
          STEP_ATTEMPT_FINISHED, APPROVAL_REQUESTED, APPROVAL_DECIDED, USER_ACTION_REQUESTED, USER_ACTION_COMPLETED,
          LOG, CANCEL_REQUESTED]}
        level: {type: string, enum: [info, warn, error]}
        message: {type: string}
        data: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$', example: '199000.00'}
        currency: {type: string, enum: [VND, SGD, MYR, THB, PHP, IDR, TWD]}

    ProductAttribute:
      type: object
      additionalProperties: false
      required: [attribute_id, value_id]
      properties:
        attribute_id: {type: integer, minimum: 1}
        value_id: {type: integer, minimum: 0}
        original_value_name: {type: string}
        value_unit: {type: string}

    PackageCm:
      type: object
      additionalProperties: false
      required: [length, width, height]
      properties:
        length: {type: integer, minimum: 1, maximum: 1000}
        width: {type: integer, minimum: 1, maximum: 1000}
        height: {type: integer, minimum: 1, maximum: 1000}

    Tier:
      type: object
      additionalProperties: false
      required: [name, options]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        options:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 50}

    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, price, currency, stock]
      properties:
        sku: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 10000}
        shopee_category_id: {type: string, nullable: true, pattern: '^[0-9]+$'}
        category_label: {type: string, nullable: true}
        brand_name: {type: string, nullable: true}
        condition: {type: string, nullable: true, enum: [NEW, USED, null]}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/ProductAttribute'}
        price: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
        currency: {type: string}
        stock: {type: integer, minimum: 0}
        weight_kg: {type: string, nullable: true}
        package_cm:
          allOf: [{$ref: '#/components/schemas/PackageCm'}]
          nullable: true
        days_to_ship: {type: integer, nullable: true}
        tiers:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/Tier'}
        variations:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [tier_index, price, stock]
            properties:
              tier_index:
                type: array
                items: {type: integer, minimum: 0}
              sku: {type: string, nullable: true}
              price: {type: string}
              stock: {type: integer, minimum: 0}

    ProductImage:
      type: object
      required: [id, position, url, width, height, sha256]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        url: {type: string, description: Presigned URL valid for 15 minutes}
        width: {type: integer}
        height: {type: integer}
        sha256: {type: string}

    ProductMapping:
      type: object
      required: [shop_id, publish_state, shopee_item_id, item_sku, last_error, updated_at]
      properties:
        shop_id: {type: string, format: uuid}
        publish_state: {type: string, enum: [PLANNED, CREATING, CREATED, VERIFIED, FAILED, UNKNOWN]}
        shopee_item_id: {type: string, nullable: true}
        item_sku: {type: string}
        last_error: {nullable: true}
        updated_at: {type: string, format: date-time}

    Product:
      type: object
      required: [id, sku, name, description, shopee_category_id, category_label, brand_name, condition, attributes, price,
        stock, weight_kg, package_cm, days_to_ship, tiers, variations, images, mappings, source, import_batch_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        description: {type: string}
        shopee_category_id: {type: string, nullable: true}
        category_label: {type: string, nullable: true}
        brand_name: {type: string, nullable: true}
        condition: {type: string, nullable: true}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/ProductAttribute'}
        price: {$ref: '#/components/schemas/Money'}
        stock: {type: integer}
        weight_kg: {type: string, nullable: true}
        package_cm:
          allOf: [{$ref: '#/components/schemas/PackageCm'}]
          nullable: true
        days_to_ship: {type: integer, nullable: true}
        tiers:
          type: array
          items: {$ref: '#/components/schemas/Tier'}
        variations:
          type: array
          items:
            type: object
            required: [id, tier_index, sku, price, stock]
            properties:
              id: {type: string, format: uuid}
              tier_index:
                type: array
                items: {type: integer}
              sku: {type: string, nullable: true}
              price: {$ref: '#/components/schemas/Money'}
              stock: {type: integer}
        images:
          type: array
          items: {$ref: '#/components/schemas/ProductImage'}
        mappings:
          type: array
          items: {$ref: '#/components/schemas/ProductMapping'}
        source: {type: string, enum: [MANUAL, IMPORT]}
        import_batch_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ImportBatch:
      type: object
      required: [id, source, filename, status, template_id, template_version_id, total_rows, valid_rows, invalid_rows,
        imported_rows, failed_rows, has_report, error, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        source: {type: string, enum: [CSV, XLSX]}
        filename: {type: string}
        status: {type: string, enum: [UPLOADED, PARSING, IMPORTING, COMPLETED, FAILED]}
        template_id: {type: string, format: uuid, nullable: true}
        template_version_id: {type: string, format: uuid, nullable: true}
        total_rows: {type: integer}
        valid_rows: {type: integer}
        invalid_rows: {type: integer}
        imported_rows: {type: integer}
        failed_rows: {type: integer}
        has_report: {type: boolean}
        error: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ImportRow:
      type: object
      required: [id, row_number, values, status, errors, product_id]
      properties:
        id: {type: string, format: uuid}
        row_number: {type: integer, description: Line in the file (the header is line 1)}
        values:
          type: object
          additionalProperties: {type: string}
        status: {type: string, enum: [PENDING, VALID, INVALID, IMPORTED, FAILED]}
        errors:
          type: array
          items:
            type: object
            required: [column, code, message]
            properties:
              column: {type: string}
              code: {type: string}
              message: {type: string}
        product_id: {type: string, format: uuid, nullable: true}
